<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taiyo</title>
  <meta name="description" content="個人開発者Taiyoのサイト。アプリ、記事、各種リンク。">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">

    <header>
      <h1>Taiyo</h1>
      <p class="lead">iOSアプリやWebアプリを個人で開発しています。</p>
    </header>

    <!-- アプリ：新しいアプリを公開したら <li> を1つ追加する -->
    <section id="apps">
      <h2>アプリ</h2>
      <ul class="link-list">
        <li>
          <a href="https://apple.co/4m14kNx">
            <span class="title">App Store</span>
            <span class="desc">公開中のiOSアプリ一覧</span>
          </a>
        </li>
        <!--
        <li>
          <a href="/apps/【フォルダ名】/">
            <span class="title">【アプリ名】</span>
            <span class="desc">【ひとことの説明】</span>
          </a>
        </li>
        -->
      </ul>
    </section>

    <section id="writing">
      <h2>記事・ブログ</h2>
      <ul class="link-list">
        <li>
          <a href="https://zenn.dev/taiyok">
            <span class="title">Zenn</span>
            <span class="desc">技術記事</span>
          </a>
        </li>
        <!-- noteのURLを入れたらコメントを外す
        <li>
          <a href="【noteのURL】">
            <span class="title">note</span>
            <span class="desc">【説明】</span>
          </a>
        </li>
        -->
        <li>
          <a href="https://blog.sol-se.com">
            <span class="title">日曜エンジニアのソフト開発</span>
            <span class="desc">開発ブログ</span>
          </a>
        </li>
        <li>
          <a href="https://taiyosun.hatenablog.com/">
            <span class="title">海外で食べたもの図鑑</span>
            <span class="desc">旅先の食べ物の記録</span>
          </a>
        </li>
      </ul>
    </section>

    <section id="accounts">
      <h2>アカウント</h2>
      <ul class="link-list">
        <li>
          <a href="https://github.com/taiyo8911">
            <span class="title">GitHub</span>
            <span class="desc">taiyo8911</span>
          </a>
        </li>
        <li>
          <a href="https://codepen.io/maclove1/">
            <span class="title">CodePen</span>
            <span class="desc">maclove1</span>
          </a>
        </li>
      </ul>
    </section>

    <footer>
      <p>&copy; Taiyo</p>
    </footer>
